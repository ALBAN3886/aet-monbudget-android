plugins {
    id 'com.android.application'
}

// Le CI (GitHub Actions) passe -PbuildVersionCode=<numéro de build> ;
// en local (Android Studio), on retombe sur 1 par défaut.
def appVersionCode = project.hasProperty('buildVersionCode') ? project.property('buildVersionCode').toInteger() : 1

android {
    namespace "com.aet.monbudget"
    compileSdk 34
    defaultConfig {
        applicationId "com.aet.monbudget"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName "1.0." + appVersionCode
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
